upstream afaaqinstitute_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream afaaqinstitute_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.afaaqinstitute.com;
    return 301 http://afaaqinstitute.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name afaaqinstitute.com;
    client_max_body_size 10m;

    location /static/ {
        alias /var/www/afaaqinstitute/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://afaaqinstitute_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://afaaqinstitute_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
